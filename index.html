S.faq=`<section id="faq" class="px-5 md:px-12 py-24 md:py-32 bg-chamber"><h2 class="d font-display text-4xl md:text-6xl mb-10">${c.faq.h}</h2><div class="max-w-3xl">${c.faq.items.map(([q,a],i)=>`<div class="border-t border-ivory/20"><button data-f="${i}" aria-expanded="${open===i}" class="w-full text-start py-5 text-lg flex justify-between gap-4 min-h-[44px]">${q}<span class="text-brass">${open===i?'−':'+'}</span></button><p class="pb-5 text-smoke max-w-xl ${open===i?'':'hidden'}">${a}</p></div>`).join('')}</div></section>`;
